[project]
name = "debit-card-mlops"
version = "0.1.0"
description = "Debit Card Merchant Transaction ML Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pandera>=0.18.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "mlflow>=2.10.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"] # Errors, Pyflakes, Isort, Bugbear